/* ============================================================
   Make sure these two blocks are the ONLY places on the page
   that call new Chart(...) on '#trendChart' and '#projTrendChart'.
   If a second copy of either block still exists further down
   the file (or in a leftover <script> tag), delete it — Chart.js
   will silently keep whichever instance grabbed the canvas first,
   which is exactly the "still categorical / still connected"
   symptom you're seeing.
   ============================================================ */

/* ---------- POLL TREND CHART (dots only, true date-linear x-axis) ---------- */
(function(){
  const existing = Chart.getChart('trendChart');
  if (existing) existing.destroy(); // guard against a stale instance on the same canvas

  new Chart(document.getElementById('trendChart'), {
    type: 'scatter', // scatter, not line — this guarantees no connecting segments are ever drawn
    data: {
      datasets: ['AfD','CDU','LINKE','SPD','GRUENE','FDP','BSW'].map(k => ({
        label: PARTIES[k].name,
        data: polls
          .filter(p => p[k] != null)
          .map(p => ({ x: parseDate(p.date), y: p[k] })),
        borderColor: PARTIES[k].color,
        backgroundColor: PARTIES[k].color,
        pointRadius: 3.5,
        pointHoverRadius: 5,
      }))
    },
    options: {
      responsive: true,
      interaction: { mode: 'nearest', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 11, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            title: items => fmtDate(items[0].parsed.x),
            label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y + '%'
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          min: parseDate(polls[0].date),
          max: parseDate(polls[polls.length - 1].date),
          ticks: {
            callback: v => fmtDate(v),
            maxRotation: 60, minRotation: 60, autoSkip: true, maxTicksLimit: 14, font: { size: 9.5 }
          },
          grid: { display: false }
        },
        y: { min: 0, max: 46, ticks: { callback: v => v + '%', font: { size: 10 } }, grid: { color: '#eeece4' } }
      }
    }
  });
})();

/* ---------- PROJECTIONS CHART (dots only, true date-linear x-axis) ---------- */
(function(){
  const existing = Chart.getChart('projTrendChart');
  if (existing) existing.destroy();

  const projParties = ['AfD','CDU','LINKE','SPD','GRUENE','FDP','BSW'];
  const projPolls = polls.filter(p => p.inst === 'Infratest dimap' || p.inst === 'FG Wahlen');

  new Chart(document.getElementById('projTrendChart'), {
    type: 'scatter',
    data: {
      datasets: projParties.map(k => ({
        label: PARTIES[k].name,
        data: projPolls
          .filter(p => p[k] != null)
          .map(p => ({ x: parseDate(p.date), y: p[k], _inst: p.inst })),
        borderColor: PARTIES[k].color,
        backgroundColor: PARTIES[k].color,
        pointRadius: 4,
        pointHoverRadius: 6,
      }))
    },
    options: {
      responsive: true,
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 11, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            title: items => fmtDate(items[0].parsed.x) + ' (' + (items[0].raw._inst === 'Infratest dimap' ? 'ID' : 'FGW') + ')',
            label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y + '%'
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          min: parseDate(projPolls[0].date),
          max: parseDate(projPolls[projPolls.length - 1].date),
          ticks: { callback: v => fmtDate(v), maxRotation: 60, minRotation: 60, font: { size: 9.5 } },
          grid: { display: false }
        },
        y: { min: 0, max: 46, ticks: { callback: v => v + '%', font: { size: 10 } }, grid: { color: '#eeece4' } }
      }
    }
  });
})();
