name: Update election data

# repository_dispatch only fires for workflows on the default branch — this
# file has to be merged to main before the Apps Script trigger does anything.
on:
  repository_dispatch:
    types: [sheet-updated]
  workflow_dispatch:
  schedule:
    # Offset from the hour and off a round interval: */5 is the most
    # contended pattern and GitHub was dropping it entirely. Still only a
    # backstop — the Apps Script dispatch is the primary trigger.
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write
  pages: write

# Queued, not cancelled: a cancelled run could drop a result that landed
# mid-count.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit — a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # client_payload is attacker-controlled if the dispatch PAT leaks, so it
      # is never read and never interpolated into a run block.

      # A Pages build can fail, or hang in "building" and never finish - one
      # sat there for 32 minutes today while the site kept serving the
      # previous commit, with GitHub reporting Pages as operational. Either
      # way the deploy silently stops and nothing signals it. Requesting a
      # build clears both; the stuck one flips to errored and the new one
      # finished in 35 seconds.
      - name: Recover a failed or stalled Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          info=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.[0] | "\(.status) \(.created_at)"' 2>/dev/null || echo "unknown -")
          status=${info%% *}
          created=${info##* }
          echo "last Pages build: ${status} (${created})"

          stalled=0
          if [ "${status}" = "building" ] && [ "${created}" != "-" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "${created}" +%s) ))
            echo "that build has been running for ${age}s"
            [ "${age}" -gt 300 ] && stalled=1
          fi

          if [ "${status}" = "errored" ] || [ "${stalled}" = "1" ]; then
            echo "::warning::Pages build ${status} for ${created} - requesting a rebuild so the site stops serving stale data"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "::warning::rebuild request failed"
          fi


      - name: Test the transform
        run: node scripts/build-data.test.js

      - name: Build data
        run: node scripts/build-data.js

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          git add data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "Update election data [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash
          done
          echo "could not push after 3 attempts" >&2
          exit 1

      # The charts read the Sheet directly; republishing is what makes them
      # re-fetch it.
      - name: Republish Datawrapper charts
        env:
          DATAWRAPPER_TOKEN: ${{ secrets.DATAWRAPPER_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${DATAWRAPPER_TOKEN}" ]; then
            echo "::warning::DATAWRAPPER_TOKEN not set — skipping chart republish"
            exit 0
          fi
          # Live-data charts only. pIGRE and mxgOm are static history.
          failed=0
          for id in TviGe k247d YC0Gm n6ZSl Kc3lD EsjOj W2k84; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${DATAWRAPPER_TOKEN}" \
              "https://api.datawrapper.de/v3/charts/${id}/publish")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "republished $id"
            else
              echo "::warning::$id republish returned HTTP $code"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -eq 7 ]; then
            echo "::error::every chart republish failed — check the token"
            exit 1
          fi
