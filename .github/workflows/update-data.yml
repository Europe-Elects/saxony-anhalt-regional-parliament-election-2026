name: Update election data

# repository_dispatch only fires for workflows on the default branch — this
# file has to be merged to main before the Apps Script trigger does anything.
on:
  repository_dispatch:
    types: [sheet-updated]
  workflow_dispatch:
  schedule:
    # Offset from the hour and off a round interval: */5 is the most
    # contended pattern and GitHub was dropping it entirely. Still only a
    # backstop — the Apps Script dispatch is the primary trigger.
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: write
  pages: read

# Queued, not cancelled: a cancelled run could drop a result that landed
# mid-count.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit — a tag can be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # client_payload is attacker-controlled if the dispatch PAT leaks, so it
      # is never read and never interpolated into a run block.

      # A Pages build can fail when two land close together. The failed one
      # simply does not deploy, so the site silently keeps serving the
      # previous commit. Runs are frequent, so the cheapest recovery is to
      # notice here and force a redeploy on this run.
      - name: Recover a failed Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds" --jq '.[0].status' 2>/dev/null || echo unknown)
          echo "last Pages build: ${status}"
          if [ "${status}" = "errored" ]; then
            echo "PAGES_RETRY=1" >> "$GITHUB_ENV"
            echo "::warning::The previous Pages build failed — forcing a redeploy so the site stops serving stale data"
          fi

      - name: Test the transform
        run: node scripts/build-data.test.js

      - name: Build data
        run: node scripts/build-data.js

      - name: Commit and push if anything changed
        run: |
          set -euo pipefail
          git add data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            if [ "${PAGES_RETRY:-}" = "1" ]; then
              git commit --allow-empty -m "Redeploy after a failed Pages build [skip ci]"
            else
              echo "no data changes"
              exit 0
            fi
          else
            git commit -m "Update election data [skip ci]"
          fi
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash
          done
          echo "could not push after 3 attempts" >&2
          exit 1

      # The charts read the Sheet directly; republishing is what makes them
      # re-fetch it.
      - name: Republish Datawrapper charts
        env:
          DATAWRAPPER_TOKEN: ${{ secrets.DATAWRAPPER_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${DATAWRAPPER_TOKEN}" ]; then
            echo "::warning::DATAWRAPPER_TOKEN not set — skipping chart republish"
            exit 0
          fi
          # Live-data charts only. pIGRE and mxgOm are static history.
          failed=0
          for id in TviGe k247d YC0Gm n6ZSl Kc3lD EsjOj W2k84; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${DATAWRAPPER_TOKEN}" \
              "https://api.datawrapper.de/v3/charts/${id}/publish")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "republished $id"
            else
              echo "::warning::$id republish returned HTTP $code"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -eq 7 ]; then
            echo "::error::every chart republish failed — check the token"
            exit 1
          fi
